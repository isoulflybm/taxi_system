<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — Taxi KG</title>
<style>body{font:16px system-ui;background:#f2f5f3;display:grid;place-items:center;min-height:100vh;margin:0;color:#15261f}.box{background:white;padding:32px;border-radius:16px;width:min(360px,calc(100% - 48px));box-shadow:0 10px 40px #17382616}label{display:block;margin:14px 0 5px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd6d0;border-radius:8px}button{width:100%;padding:12px;margin-top:20px;border:0;border-radius:8px;background:#167a4a;color:white;font-weight:700}</style>
</head><body><form class="box" method="post">{% csrf_token %}<h1>Вход в Taxi KG</h1>{{ form.non_field_errors }}<label for="id_username">Логин</label>{{ form.username }}<label for="id_password">Пароль</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Войти</button></form></body></html>
